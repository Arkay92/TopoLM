[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "topolm"
version = "0.0.10"
description = "Topology-native explainable language model prototype powered by Topologist"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Robert McMenemy"}]
dependencies = ["numpy>=1.23", "networkx>=3.0", "topologist>=0.4.0"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/Arkay92/TopoLM"
Repository = "https://github.com/Arkay92/TopoLM.git"
"Bug Tracker" = "https://github.com/Arkay92/TopoLM/issues"

[project.optional-dependencies]
ml = ["scikit-learn>=1.3", "torch>=2.0"]
hf = ["datasets>=2.18"]
dev = ["pytest>=7.0", "ruff>=0.5", "build>=0.10", "twine>=4.0"]

[project.scripts]
topolm = "topolm.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["topolm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
